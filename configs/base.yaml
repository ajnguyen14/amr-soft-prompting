model:
  # Not an actual toggle: ESM2Wrapper always freezes ESM-2 internally,
  # unconditionally, regardless of this value. Documents the invariant only.
  freeze_esm2: true

training:
  batch_size: 32
  learning_rate: 1.0e-4
  epochs: 50
  optimizer: "adam"

classifier:
  hidden_dim: 512
  dropout: 0.1

loss:
  weight_amr_gene_family: 1.0

# tblastn thresholds for mapping CARD proteins onto RefSeq genomic coordinates
# (V2 TA-proximity pipeline, src/data/blast_runner.py). Conservative defaults
# per CLAUDE.md; not yet tuned against the real 293-genome coverage numbers.
blast:
  min_pident: 95.0
  min_qcov: 90.0
  max_evalue: 1.0e-10

# Categorical distance bins for TA-locus proximity (V2 TA-proximity pipeline
# Step 4, src/data/ta_proximity.py). Intentionally left unset: per CLAUDE.md,
# edges must come from the actual same-replicon distance histogram, not be
# chosen a priori. Run scripts/preprocess_ta_proximity.py once against real
# BLAST/TADB data first -- it prints that histogram -- then set this list
# (ascending bp thresholds, e.g. [1000, 10000, 100000]) and re-run.
ta_proximity:
  distance_bin_edges_bp: null

logging:
  wandb_project: "amr-soft-prompting"
  wandb_run_name: null  # auto-generated if null
