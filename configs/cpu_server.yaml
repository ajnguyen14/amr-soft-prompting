paths:
  card_fasta: "/data/aidannguyen/amr-soft-prompting/data/raw/protein_fasta_protein_homolog_model.fasta"
  card_json: "/data/aidannguyen/amr-soft-prompting/data/raw/card.json"
  aro_index: "/data/aidannguyen/amr-soft-prompting/data/raw/aro_index.tsv"
  output_dir: "/data/aidannguyen/amr-soft-prompting/outputs/cpu_server/"
  refseq_manifest: "/data/aidannguyen/amr-soft-prompting/data/manifests/refseq_species_accessions.json"
  refseq_genomes_dir: "/data/aidannguyen/amr-soft-prompting/data/raw/refseq_genomes/"
  refseq_blast_db: "/data/aidannguyen/amr-soft-prompting/data/processed/refseq_blastdb/refseq_blastdb"
  tadb_toxin_exp: "/data/aidannguyen/amr-soft-prompting/data/raw/type_II_T_exp.fas"
  tadb_antitoxin_exp: "/data/aidannguyen/amr-soft-prompting/data/raw/type_II_AT_exp.fas"
  tadb_toxin_pre: "/data/aidannguyen/amr-soft-prompting/data/raw/type_II_T_pre.fas"
  tadb_antitoxin_pre: "/data/aidannguyen/amr-soft-prompting/data/raw/type_II_AT_pre.fas"

# num_threads is a performance knob only (never affects which hits pass, so
# it's excluded from preprocess_ta_proximity.py's cache-staleness check) --
# this host has 48 cores, confirmed idle via `top` before setting this.
blast:
  num_threads: 16

model:
  esm2_variant: "facebook/esm2_t30_150M_UR50D"
  device: "cpu"
  # No training/gradient-update runs happen on the CPU server (CLAUDE.md
  # escalation rules) -- this config is for pipeline/shape validation via
  # inference only, so injection_mode is arbitrary here; validation scripts
  # should exercise both modes explicitly rather than relying on this default.
  injection_mode: "internal"

training:
  # CLAUDE.md caps CPU-server inference at batch <= 8 (150M model).
  batch_size: 8
  learning_rate: 1.0e-4
  epochs: 50
  optimizer: "adam"
