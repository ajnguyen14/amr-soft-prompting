paths:
  card_fasta: "/data/aidannguyen/amr-soft-prompting/data/raw/protein_fasta_protein_homolog_model.fasta"
  card_json: "/data/aidannguyen/amr-soft-prompting/data/raw/card.json"
  aro_index: "/data/aidannguyen/amr-soft-prompting/data/raw/aro_index.tsv"
  # Separate from gpu_server_internal.yaml's output_dir so the two ablations
  # never overwrite each other's checkpoint.
  output_dir: "/data/aidannguyen/amr-soft-prompting/outputs/external/"
  refseq_manifest: "/data/aidannguyen/amr-soft-prompting/data/manifests/refseq_species_accessions.json"
  refseq_genomes_dir: "/data/aidannguyen/amr-soft-prompting/data/raw/refseq_genomes/"
  refseq_blast_db: "/data/aidannguyen/amr-soft-prompting/data/processed/refseq_blastdb/refseq_blastdb"

model:
  esm2_variant: "facebook/esm2_t33_650M_UR50D"
  device: "cuda"
  # Along with output_dir above, the only fields that differ from
  # gpu_server_internal.yaml.
  injection_mode: "external"

training:
  batch_size: 24
  learning_rate: 1.0e-4
  epochs: 50
  optimizer: "adam"
